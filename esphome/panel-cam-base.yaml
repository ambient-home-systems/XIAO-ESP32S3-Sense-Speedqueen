# ---------------------------------------------------------------------------
# Shared camera node for reading a Speed Queen control panel.
#
# Don't flash this file directly — it's a package. Include it from a per-node
# file (dryer-cam.yaml, washer-cam.yaml) that sets the substitutions below and
# supplies that node's own API and OTA secrets.
#
# Every auto-adjusting feature is turned OFF on purpose. Auto exposure hunts
# between the near-black panel and the bright LEDs, which blooms the segments
# together and makes the segment thresholds move from frame to frame. Fixed
# exposure is what makes the decode repeatable.
#
# aec_value is the exposure time in sensor row units. Higher = longer
# integration, which also averages across several display multiplex cycles so
# segments are never caught mid-refresh. Start at 300 and tune with the
# calibration tool: you want the lit segments bright but NOT clipped to white,
# with visible dark gaps between neighbouring segments. Each machine's panel
# sits in its own light, so expect the two nodes to land on different values.
# ---------------------------------------------------------------------------
substitutions:
  camera_name: Panel
  aec_value: "300"
  contrast: "2"
  saturation: "-2"
  brightness: "0"
  ae_level: "-2"
  # Set these when you mount the camera. Both true turns the image 180°, which
  # is what an upside-down mount needs. The sensor can flip and mirror but
  # cannot rotate 90° — for that the camera has to be mounted square.
  vertical_flip: "false"
  horizontal_mirror: "false"
  # Heat. The board runs warm enough to matter in a laundry room, and these
  # are the two settings that cost the most for the least benefit here.
  #
  # power_save_mode light is ESPHome's own default for the ESP32. none keeps
  # the radio fully awake, which this node has no use for — it answers a
  # request every 10 to 60 seconds. Set it back to none on a node whose access
  # point drops a sleeping client.
  wifi_power_save: light
  # 0 fps means the camera captures only when something asks for a frame,
  # rather than one every ten seconds forever. Safe here because exposure and
  # gain are fixed, so a frame taken cold is the same as a frame taken warm —
  # there is no auto-adjustment that needs to settle. Raise it if the first
  # snapshot after a quiet spell ever looks different from the rest.
  idle_framerate: "0 fps"

# Runs last, once the numbers have restored and the camera is up. Without
# this the restored values would sit in the entities and never reach the
# sensor. Priority -100 is the lowest, so nothing is half-initialised.
esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          if (!std::isnan(id(cam_aec_value).state))
            id(panel_cam).set_aec_value((uint32_t) id(cam_aec_value).state);
          if (!std::isnan(id(cam_ae_level).state))
            id(panel_cam).set_ae_level((int) id(cam_ae_level).state);
          if (!std::isnan(id(cam_contrast).state))
            id(panel_cam).set_contrast((int) id(cam_contrast).state);
          if (!std::isnan(id(cam_brightness).state))
            id(panel_cam).set_brightness((int) id(cam_brightness).state);
          if (!std::isnan(id(cam_saturation).state))
            id(panel_cam).set_saturation((int) id(cam_saturation).state);
          if (!std::isnan(id(cam_agc_value).state))
            id(panel_cam).set_agc_value((uint8_t) id(cam_agc_value).state);
          id(panel_cam).update_camera_parameters();
          ESP_LOGI("panel_cam", "Applied saved camera settings: exposure %.0f, "
                   "level %.0f, contrast %.0f, brightness %.0f, saturation %.0f, gain %.0f",
                   id(cam_aec_value).state, id(cam_ae_level).state,
                   id(cam_contrast).state, id(cam_brightness).state,
                   id(cam_saturation).state, id(cam_agc_value).state);

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

# Credentials are NOT here — each node file supplies them, or leaves them out
# and provisions over the fallback hotspot below.
wifi:
  power_save_mode: ${wifi_power_save}
  # Only comes up when the node cannot join your network: a new node with no
  # credentials compiled in, or an existing one after the Wi-Fi changed. Join
  # it and a captive portal asks for the SSID and password, which are saved to
  # flash and survive later updates. Add a `password:` here (8 characters or
  # more) if you would rather it not be open.
  ap:
    ssid: ${device_name}

# Serves the "which network?" page on the fallback hotspot. Without it, a node
# that cannot connect is a brick until you reflash it over USB.
captive_portal:

esp32_camera:
  id: panel_cam
  name: ${camera_name}
  external_clock:
    pin: GPIO10
    frequency: 20MHz
  i2c_pins:
    sda: GPIO40
    scl: GPIO39
  data_pins: [GPIO15, GPIO17, GPIO18, GPIO16, GPIO14, GPIO12, GPIO11, GPIO48]
  vsync_pin: GPIO38
  href_pin: GPIO47
  pixel_clock_pin: GPIO13

  resolution: 1600x1200
  jpeg_quality: 10

  # Low frame rates keep the board cool. The decoder pulls snapshots on demand,
  # and idle capture is off by default — see the substitutions above.
  max_framerate: 1 fps
  idle_framerate: ${idle_framerate}

  aec_mode: manual
  aec_value: ${aec_value}
  aec2: false
  ae_level: ${ae_level}
  agc_mode: manual
  agc_value: 0
  wb_mode: office

  brightness: ${brightness}
  contrast: ${contrast}
  saturation: ${saturation}

  vertical_flip: ${vertical_flip}
  horizontal_mirror: ${horizontal_mirror}

# Plain HTTP JPEG endpoint the add-on polls, served at the root of this port:
#   http://${device_name}.local:8081/
esp32_camera_web_server:
  - port: 8081
    mode: snapshot

# ---------------------------------------------------------------------------
# Live tuning controls
#
# These appear on the camera's device page in Home Assistant and take effect
# on the next frame — no rebuild, no reflash. They exist because hunting for
# an exposure value by editing YAML and reinstalling is a slow way to find a
# number, especially when what you are judging is "bright but not clipped".
#
# They survive a reboot. Two halves are needed for that, and one without the
# other is worse than neither:
#
#   restore_value saves what you set into flash. But the component's setup()
#   only restores the number and publishes it — it never calls control(), so
#   set_action does not fire. On its own that would leave the slider reading
#   450 while the camera still ran at whatever was compiled in: the UI would
#   claim one thing and the sensor do another.
#
#   So on_boot below re-applies whatever the numbers restored, once the
#   entities and the camera are both up. That is what actually gets the value
#   into the sensor.
#
# The values in `substitutions` are now the factory defaults: used on a node's
# very first boot, and after that only if nothing has been stored. Once you
# move a slider, the slider is the truth — which is visible in Home Assistant
# rather than hidden, and it is why the boot log prints what it applied.
#
# Flip and mirror are not here: they are set once when you mount the camera,
# and a live toggle that disagreed with the compiled value would be a nasty
# thing to debug later.
# ---------------------------------------------------------------------------
number:
  - platform: template
    name: Exposure
    id: cam_aec_value
    icon: mdi:camera-iris
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${aec_value}
    min_value: 0
    max_value: 1200
    step: 25
    mode: slider
    set_action:
      - lambda: |-
          id(panel_cam).set_aec_value((uint32_t) x);
          id(panel_cam).update_camera_parameters();

  - platform: template
    name: Exposure level
    id: cam_ae_level
    icon: mdi:brightness-6
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${ae_level}
    min_value: -2
    max_value: 2
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          id(panel_cam).set_ae_level((int) x);
          id(panel_cam).update_camera_parameters();

  - platform: template
    name: Contrast
    id: cam_contrast
    icon: mdi:contrast-circle
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${contrast}
    min_value: -2
    max_value: 2
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          id(panel_cam).set_contrast((int) x);
          id(panel_cam).update_camera_parameters();

  - platform: template
    name: Brightness
    id: cam_brightness
    icon: mdi:brightness-5
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${brightness}
    min_value: -2
    max_value: 2
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          id(panel_cam).set_brightness((int) x);
          id(panel_cam).update_camera_parameters();

  - platform: template
    name: Saturation
    id: cam_saturation
    icon: mdi:palette
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${saturation}
    min_value: -2
    max_value: 2
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          id(panel_cam).set_saturation((int) x);
          id(panel_cam).update_camera_parameters();

  - platform: template
    name: Gain
    id: cam_agc_value
    icon: mdi:signal
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "0"
    min_value: 0
    max_value: 30
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          id(panel_cam).set_agc_value((uint8_t) x);
          id(panel_cam).update_camera_parameters();

sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 120s

  - platform: internal_temperature
    name: Board temperature
    update_interval: 60s
