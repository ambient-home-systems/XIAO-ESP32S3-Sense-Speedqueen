# ---------------------------------------------------------------------------
# Shared camera node for reading a Speed Queen control panel.
#
# Don't flash this file directly — it's a package. Include it from a per-node
# file (dryer-cam.yaml, washer-cam.yaml) that sets the substitutions below and
# supplies that node's own API and OTA secrets.
#
# Every auto-adjusting feature is turned OFF on purpose. Auto exposure hunts
# between the near-black panel and the bright LEDs, which blooms the segments
# together and makes the segment thresholds move from frame to frame. Fixed
# exposure is what makes the decode repeatable.
#
# aec_value is the exposure time in sensor row units. Higher = longer
# integration, which also averages across several display multiplex cycles so
# segments are never caught mid-refresh. Start at 300 and tune with the
# calibration tool: you want the lit segments bright but NOT clipped to white,
# with visible dark gaps between neighbouring segments. Each machine's panel
# sits in its own light, so expect the two nodes to land on different values.
# ---------------------------------------------------------------------------
substitutions:
  camera_name: Panel
  aec_value: "300"
  contrast: "2"
  saturation: "-2"
  brightness: "0"
  ae_level: "-2"
  # Set these when you mount the camera. Both true turns the image 180°, which
  # is what an upside-down mount needs. The sensor can flip and mirror but
  # cannot rotate 90° — for that the camera has to be mounted square.
  vertical_flip: "false"
  horizontal_mirror: "false"

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

# Credentials are NOT here — each node file supplies them, or leaves them out
# and provisions over the fallback hotspot below.
wifi:
  power_save_mode: none
  # Only comes up when the node cannot join your network: a new node with no
  # credentials compiled in, or an existing one after the Wi-Fi changed. Join
  # it and a captive portal asks for the SSID and password, which are saved to
  # flash and survive later updates. Add a `password:` here (8 characters or
  # more) if you would rather it not be open.
  ap:
    ssid: ${device_name}

# Serves the "which network?" page on the fallback hotspot. Without it, a node
# that cannot connect is a brick until you reflash it over USB.
captive_portal:

esp32_camera:
  id: panel_cam
  name: ${camera_name}
  external_clock:
    pin: GPIO10
    frequency: 20MHz
  i2c_pins:
    sda: GPIO40
    scl: GPIO39
  data_pins: [GPIO15, GPIO17, GPIO18, GPIO16, GPIO14, GPIO12, GPIO11, GPIO48]
  vsync_pin: GPIO38
  href_pin: GPIO47
  pixel_clock_pin: GPIO13

  resolution: 1600x1200
  jpeg_quality: 10

  # Low frame rates keep the board cool. The decoder pulls snapshots on demand.
  max_framerate: 1 fps
  idle_framerate: 0.1 fps

  aec_mode: manual
  aec_value: ${aec_value}
  aec2: false
  ae_level: ${ae_level}
  agc_mode: manual
  agc_value: 0
  wb_mode: office

  brightness: ${brightness}
  contrast: ${contrast}
  saturation: ${saturation}

  vertical_flip: ${vertical_flip}
  horizontal_mirror: ${horizontal_mirror}

# Plain HTTP JPEG endpoint the add-on polls, served at the root of this port:
#   http://${device_name}.local:8081/
esp32_camera_web_server:
  - port: 8081
    mode: snapshot

# ---------------------------------------------------------------------------
# Live tuning controls
#
# These appear on the camera's device page in Home Assistant and take effect
# on the next frame — no rebuild, no reflash. They exist because hunting for
# an exposure value by editing YAML and reinstalling is a slow way to find a
# number, especially when what you are judging is "bright but not clipped".
#
# They are deliberately NOT persisted. Every boot starts from the values
# compiled into this file, so the YAML stays the single source of truth and a
# node can never quietly disagree with its own configuration. When you find
# numbers you like, write them into that node's file — that is what makes
# them permanent, and what a fresh flash will use.
#
# Flip and mirror are not here: they are set once when you mount the camera,
# and a live toggle that disagreed with the compiled value would be a nasty
# thing to debug later.
# ---------------------------------------------------------------------------
number:
  - platform: template
    name: Exposure
    id: cam_aec_value
    icon: mdi:camera-iris
    entity_category: config
    optimistic: true
    initial_value: ${aec_value}
    min_value: 0
    max_value: 1200
    step: 25
    mode: slider
    set_action:
      - lambda: |-
          id(panel_cam).set_aec_value((uint32_t) x);
          id(panel_cam).update_camera_parameters();

  - platform: template
    name: Exposure level
    id: cam_ae_level
    icon: mdi:brightness-6
    entity_category: config
    optimistic: true
    initial_value: ${ae_level}
    min_value: -2
    max_value: 2
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          id(panel_cam).set_ae_level((int) x);
          id(panel_cam).update_camera_parameters();

  - platform: template
    name: Contrast
    id: cam_contrast
    icon: mdi:contrast-circle
    entity_category: config
    optimistic: true
    initial_value: ${contrast}
    min_value: -2
    max_value: 2
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          id(panel_cam).set_contrast((int) x);
          id(panel_cam).update_camera_parameters();

  - platform: template
    name: Brightness
    id: cam_brightness
    icon: mdi:brightness-5
    entity_category: config
    optimistic: true
    initial_value: ${brightness}
    min_value: -2
    max_value: 2
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          id(panel_cam).set_brightness((int) x);
          id(panel_cam).update_camera_parameters();

  - platform: template
    name: Saturation
    id: cam_saturation
    icon: mdi:palette
    entity_category: config
    optimistic: true
    initial_value: ${saturation}
    min_value: -2
    max_value: 2
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          id(panel_cam).set_saturation((int) x);
          id(panel_cam).update_camera_parameters();

  - platform: template
    name: Gain
    id: cam_agc_value
    icon: mdi:signal
    entity_category: config
    optimistic: true
    initial_value: "0"
    min_value: 0
    max_value: 30
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          id(panel_cam).set_agc_value((uint8_t) x);
          id(panel_cam).update_camera_parameters();

sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 120s

  - platform: internal_temperature
    name: Board temperature
    update_interval: 60s
