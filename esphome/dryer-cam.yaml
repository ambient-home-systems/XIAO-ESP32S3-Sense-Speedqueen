substitutions:
  device_name: dryer-cam

esphome:
  name: ${device_name}
  friendly_name: Dryer camera

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret dryer_cam_api_key

ota:
  - platform: esphome
    password: !secret dryer_cam_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

# ---------------------------------------------------------------------------
# Camera
#
# Every auto-adjusting feature is turned OFF on purpose. Auto exposure hunts
# between the near-black panel and the bright LEDs, which blooms the segments
# together and makes the segment thresholds move from frame to frame. Fixed
# exposure is what makes the decode repeatable.
#
# aec_value is the exposure time in sensor row units. Higher = longer
# integration, which also averages across several display multiplex cycles so
# segments are never caught mid-refresh. Start at 300 and tune with the
# calibration tool: you want the lit segments bright but NOT clipped to white,
# with visible dark gaps between neighbouring segments.
# ---------------------------------------------------------------------------
esp32_camera:
  name: Dryer panel
  external_clock:
    pin: GPIO10
    frequency: 20MHz
  i2c_pins:
    sda: GPIO40
    scl: GPIO39
  data_pins: [GPIO15, GPIO17, GPIO18, GPIO16, GPIO14, GPIO12, GPIO11, GPIO48]
  vsync_pin: GPIO38
  href_pin: GPIO47
  pixel_clock_pin: GPIO13

  resolution: 1600x1200
  jpeg_quality: 10

  # Low frame rates keep the board cool. The decoder pulls snapshots on demand.
  max_framerate: 1 fps
  idle_framerate: 0.1 fps

  aec_mode: manual
  aec_value: 300
  aec2: false
  ae_level: -2
  agc_mode: manual
  agc_value: 0
  wb_mode: office

  brightness: 0
  contrast: 2
  saturation: -2

  vertical_flip: false
  horizontal_mirror: false

# Plain HTTP JPEG endpoint the add-on polls:
#   http://dryer-cam.local:8081/snapshot
esp32_camera_web_server:
  - port: 8081
    mode: snapshot

# Reboot if Wi-Fi is lost for 15 minutes rather than sitting there dark.
sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 120s

  - platform: internal_temperature
    name: Board temperature
    update_interval: 60s
