# Camera node watching the dryer's panel. The camera block lives in
# panel-cam-base.yaml so both nodes stay tuned the same way; keep both files
# in your ESPHome config directory.
substitutions:
  device_name: dryer-cam
  friendly_name: Dryer camera
  camera_name: Dryer panel
  # Tune per node — see the notes in panel-cam-base.yaml.
  aec_value: "300"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret dryer_cam_api_key

ota:
  - platform: esphome
    password: !secret dryer_cam_ota_password

packages:
  cam: !include panel-cam-base.yaml
