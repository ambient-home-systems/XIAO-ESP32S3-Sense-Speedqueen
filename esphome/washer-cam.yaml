# Camera node watching the washer's panel. The camera block itself is pulled
# from the repository below, so this is the only file you need locally.
# Needs its own secrets: washer_cam_api_key and washer_cam_ota_password.
substitutions:
  device_name: washer-cam
  friendly_name: Washer camera
  camera_name: Washer panel
  # Tune per node — see the notes in panel-cam-base.yaml. A washer panel in a
  # brighter spot than the dryer wants a lower value, not the dryer's.
  aec_value: "300"
  # This mount holds the camera upside down, so the image is turned 180°.
  # Set both to "false" if yours is the right way up.
  vertical_flip: "true"
  horizontal_mirror: "true"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret washer_cam_api_key

ota:
  - platform: esphome
    password: !secret washer_cam_ota_password

# Wi-Fi credentials from your secrets.yaml. Delete this block to provision the
# node over its own hotspot instead — useful for a node you have not flashed
# before, or to keep credentials out of the firmware entirely.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  # Pulled from the repository, so this is the only file you need in your
  # ESPHome config directory. Change @main to a tag if you would rather
  # updates be deliberate, or use `!include panel-cam-base.yaml` to work
  # against a local copy.
  cam: github://ambient-home-systems/XIAO-ESP32S3-Sense-Speedqueen/esphome/panel-cam-base.yaml@main
