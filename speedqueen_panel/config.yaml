name: Speed Queen panel reader
version: "0.9.0"
slug: speedqueen_panel
description: Decodes Speed Queen 7-series control panels from camera snapshots into Home Assistant entities
url: https://github.com/ambient-home-systems/XIAO-ESP32S3-Sense-Speedqueen
arch:
  - aarch64
  - amd64
  - armv7
init: false
# camera_entity reads a Home Assistant camera through HA's API.
homeassistant_api: true
hassio_api: false
# The calibration tool is served here. Home Assistant handles the auth and
# proxies it; nothing listens outside. Keep in step with INGRESS_PORT in
# decoder.py.
ingress: true
ingress_port: 8099
startup: application
boot: auto
map:
  - homeassistant_config:rw
  # the AI reader hands a frame to a Home Assistant AI Task as a file under /media
  - media:rw
services:
  - mqtt:need
options:
  machines:
    - type: dr7
      snapshot_url: "http://dryer-cam.local:8081/"
      calibration_path: "/homeassistant/speedqueen_panel/dr7.json"
  publish_debug_image: true
  log_level: info
  auto_rebase: true
  ai:
    provider: none
schema:
  machines:
    - type: list(dr7|tr7)
      id: str?
      name: str?
      snapshot_url: url?
      camera_entity: match(^camera\.[a-z0-9_]+$)?
      calibration_path: str
      poll_active: int(2,600)?
      poll_idle: int(5,3600)?
      keep_frames: int(0,2000)?
  publish_debug_image: bool
  log_level: list(debug|info|warning|error)
  # 0.9.0: bake a camera move that has held 30 min into the calibration while the machine is idle
  auto_rebase: bool?
  # Optional AI reader (see DOCS.md). provider none = the decoder alone.
  ai:
    provider: list(none|home_assistant|openai_compatible)
    entity_id: str?
    escalate_entity_id: str?
    base_url: str?
    api_key: password?
    model: str?
    escalate_model: str?
    every: int(0,3600)?
    max_calls_per_day: int(0,100000)?
    timeout: int(5,300)?
